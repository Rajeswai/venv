<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Internship Application Form | Virtual Internship</title>

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    body {
      background: linear-gradient(135deg, #f0f7ff, #e2ebff);
      font-family: 'Poppins', sans-serif;
      color: #1b2a4e;
    }

    .card {
      background: #ffffff;
      border-radius: 18px;
      padding: 40px;
      box-shadow: 0px 5px 25px rgba(0, 0, 0, 0.1);
      max-width: 720px;
      margin: 60px auto;
      border: 1px solid #c9dcff;
    }

    h3 {
      color: #004aad;
      font-weight: 700;
    }

    label {
      font-weight: 500;
      color: #1b2a4e;
    }

    .form-control,
    .form-select {
      border: 1px solid #c7d8ff;
      border-radius: 10px;
    }

    .form-control:focus,
    .form-select:focus {
      border-color: #004aad;
      box-shadow: 0 0 5px rgba(0, 74, 173, 0.3);
    }

    .btn-success {
      background-color: #004aad;
      border: none;
      font-weight: 600;
      padding: 10px 30px;
      border-radius: 30px;
      transition: 0.3s;
    }

    .btn-success:hover {
      background-color: #00337f;
    }

    footer {
      background-color: #e9f2ff;
      color: #004aad;
      text-align: center;
      padding: 15px 0;
      margin-top: 70px;
      font-weight: 500;
      border-top: 2px solid #c7d8ff;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="card">
      <h3 class="text-center mb-4">Apply for Internship</h3>

      <form method="POST" action="{{ url_for('submit_form') }}">
        <!-- Name -->
        <div class="mb-3">
          <label class="form-label">Full Name</label>
          <input type="text" name="name" class="form-control" placeholder="Enter your full name" required>
        </div>

        <!-- Email -->
        <div class="mb-3">
          <label class="form-label">Email</label>
          <input type="email" name="email" class="form-control" placeholder="Enter your email" required>
        </div>

        <!-- Education -->
        <div class="mb-3">
          <label class="form-label">Education</label>
          <input type="text" name="education" class="form-control" placeholder="Your qualification" required>
        </div>

        <!-- Skills -->
        <div class="mb-3">
          <label class="form-label">Skills</label>
          <input type="text" name="skills" class="form-control" placeholder="List your skills" required>
        </div>

        <!-- Internship Choice -->
        <div class="mb-3">
          <label class="form-label">Internship Title</label>
          <select name="internship_id" class="form-select" required>
            <option value="">-- Select Internship --</option>
            {% for internship in internships %}
              <option value="{{ internship.id }}">{{ internship.title }}</option>
            {% endfor %}
          </select>
        </div>

        <!-- Submit -->
        <div class="text-center">
          <button type="submit" class="btn btn-success px-5">Submit Application</button>
        </div>
      </form>
    </div>
  </div>

  <footer>
    © 2025 Virtual Internship Portal. All Rights Reserved.
  </footer>

</body>
</html>
