<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Update Profile</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
  <div class="container mt-5">
    <h2 class="text-success mb-4">Update Your Profile</h2>

    <form method="POST" action="/update_profile">
      <!-- Name Field -->
      <div class="mb-3">
        <label for="name" class="form-label">Full Name</label>
        <input type="text" name="name" id="name"
               value="{{ intern.name if intern else '' }}"
               class="form-control" required>
      </div>

      <!--  Education -->
      <div class="mb-3">
        <label for="education" class="form-label">Education</label>
        <input type="text" name="education" id="education"
               value="{{ intern.education if intern else '' }}"
               class="form-control">
      </div>

      <!--  Skills -->
      <div class="mb-3">
        <label for="skills" class="form-label">Skills</label>
        <input type="text" name="skills" id="skills"
               value="{{ intern.skills if intern else '' }}"
               class="form-control">
      </div>

      <!-- Joining Date -->
      <div class="mb-3">
        <label for="joining_date" class="form-label">Joining Date</label>
        <input type="date" name="joining_date" id="joining_date"
               value="{{ intern.joining_date if intern else '' }}"
               class="form-control">
      </div>

      <button type="submit" class="btn btn-success">Save Profile</button>
    </form>

    <a href="/intern_dashboard" class="btn btn-link mt-3">Back to Dashboard</a>
  </div>
</body>
</html>
