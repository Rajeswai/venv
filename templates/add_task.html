<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Add Task | Admin Panel</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    body {
      font-family: 'Poppins', sans-serif;
      background: url("https://static.vecteezy.com/system/resources/previews/023/826/514/large_2x/ai-artificial-intelligence-humanoid-side-portrait-view-with-blue-and-orange-vibrant-neon-and-copy-space-artificial-intelligence-technology-concept-ai-generated-illustration-free-photo.jpg") no-repeat center center/cover;
      backdrop-filter: blur(6px);
      color: #0d47a1;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 30px 15px;
    }

    .card {
      border: none;
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(13, 71, 161, 0.25);
      background: rgba(255, 255, 255, 0.95);
      width: 100%;
      max-width: 650px;
      transition: transform 0.3s ease;
    }

    .card:hover {
      transform: translateY(-5px);
    }

    .card-header {
      background: linear-gradient(135deg, #0d47a1, #1976d2);
      color: #fff;
      text-align: center;
      padding: 25px;
      border-bottom: none;
      border-top-left-radius: 20px;
      border-top-right-radius: 20px;
    }

    .card-header h3 {
      font-weight: 700;
      letter-spacing: 0.5px;
      margin: 0;
    }

    .card-body {
      padding: 35px;
      background-color: transparent;
    }

    .form-label {
      font-weight: 600;
      color: #0d47a1;
    }

    .form-control {
      border-radius: 12px;
      border: 1px solid #bbdefb;
      padding: 10px 12px;
      transition: all 0.3s ease;
    }

    .form-control:focus {
      border-color: #1976d2;
      box-shadow: 0 0 8px rgba(25, 118, 210, 0.4);
    }

    .btn-primary {
      background: linear-gradient(135deg, #1976d2, #0d47a1);
      border: none;
      border-radius: 25px;
      padding: 10px 35px;
      font-weight: 600;
      transition: all 0.3s ease;
      color: white;
    }

    .btn-primary:hover {
      background: #0b3c91;
      transform: translateY(-2px);
    }

    .btn-secondary {
      background-color: #e3f2fd;
      border: none;
      border-radius: 25px;
      padding: 10px 30px;
      font-weight: 600;
      color: #0d47a1;
      transition: all 0.3s ease;
    }

    .btn-secondary:hover {
      background-color: #bbdefb;
      transform: translateY(-2px);
    }

    @media (max-width: 576px) {
      .card-body {
        padding: 25px 20px;
      }
    }
  </style>
</head>
<body>

  <div class="card shadow-lg">
    <div class="card-header">
      <h3>Add New Task</h3>
    </div>

    <div class="card-body">
      <form method="POST" action="/add_task">
        
        <div class="mb-3">
          <label class="form-label">Task Title</label>
          <input type="text" name="title" class="form-control" placeholder="Enter task title" required>
        </div>

        <div class="mb-3">
          <label class="form-label">Description</label>
          <textarea name="description" class="form-control" rows="3" placeholder="Enter task details" required></textarea>
        </div>

        <div class="mb-3">
          <label class="form-label">Assigned To</label>
          <input type="text" name="assigned_to" class="form-control" placeholder="Enter intern ID or name" required>
        </div>

        <div class="mb-3">
          <label class="form-label">Due Date</label>
          <input type="date" name="due_date" class="form-control" required>
        </div>

        <div class="text-center mt-4">
          <button type="submit" class="btn btn-primary">Save Task</button>
          <a href="{{ url_for('admin_dashboard') }}" class="btn btn-secondary ms-2">← Back to Dashboard</a>
        </div>

      </form>
    </div>
  </div>

</body>
</html>
