<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Virtual Internship{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    body {
      background: #f4f8ff;
      font-family: 'Poppins', sans-serif;
      color: #1b3c73;
    }

    /* Navbar */
    nav.navbar {
      background-color: #1b3c73 !important;
      padding: 10px 60px; /* balanced padding for left & right */
    }

    .navbar-brand {
      color: #ffffff !important;
      font-weight: 700;
      letter-spacing: 0.5px;
      display: flex;
      align-items: center;
    }

    .navbar-brand img {
      width: 40px;
      height: 40px;
      margin-right: 10px;
      border-radius: 50%;
      object-fit: cover;
    }

    /*  Right-aligned Navbar Links */
    .navbar-nav {
      margin-left: auto; /* pushes links to the right */
      display: flex;
      gap: 40px; /* spacing between links */
    }

    .nav-link {
      color: #f1f5ff !important;
      font-weight: 500;
      font-size: 16px;
      transition: 0.3s;
    }

    .nav-link:hover {
      color: #a9c9ff !important;
    }

    main {
      margin-top: 0 !important;
      padding-top: 0 !important;
    }

    footer {
      background-color: #1b3c73;
      color: white;
      text-align: center;
      padding: 15px 0;
      margin-top: 60px;
      font-size: 14px;
    }

    /* Responsive tweak */
    @media (max-width: 768px) {
      nav.navbar {
        padding: 10px 20px;
      }
      .navbar-nav {
        gap: 20px;
      }
    }
  </style>
</head>
<body>

  <!--Global Navbar -->
  {% include 'navbar.html' %}

  <!-- Main Page Content -->
  <main class="container mt-4">
    {% block content %}
    {% endblock %}
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
