<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Apply Internship</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    body {
      background: linear-gradient(135deg, #e8f0ff, #ffffff);
      font-family: 'Poppins', sans-serif;
      padding-top: 70px;
    }

    .container {
      max-width: 600px;
    }

    .card {
      border: none;
      border-radius: 20px;
      background-color: #ffffff;
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.1);
      padding: 30px;
    }

    h3 {
      color: #1b3c73;
      font-weight: 700;
      text-align: center;
      margin-bottom: 25px;
    }

    .form-label {
      font-weight: 600;
      color: #1b3c73;
    }

    .btn-submit {
      width: 100%;
      background-color: #1b3c73;
      color: white;
      border: none;
      border-radius: 25px;
      padding: 10px;
      font-weight: 500;
      transition: 0.3s ease;
    }

    .btn-submit:hover {
      background-color: #1450a3;
      transform: translateY(-2px);
    }
  </style>
</head>

<body>
  <div class="container">
    <div class="card">
      <h3>Apply for Internship</h3>

      <!-- MUST HAVE enctype attribute -->
      <form action="/apply_internship/{{ internship.id }}" method="POST" enctype="multipart/form-data">

        <div class="mb-3">
          <label for="name" class="form-label">Full Name</label>
          <input type="text" name="name" id="name" class="form-control" required>
        </div>

        <div class="mb-3">
          <label for="email" class="form-label">Email</label>
          <input type="email" name="email" id="email" class="form-control" required>
        </div>

        <div class="mb-3">
          <label for="resume" class="form-label">Upload Resume / Document</label>
          <input type="file" name="resume" id="resume" class="form-control" accept=".pdf,.jpg,.png,.jpeg" required>
        </div>

        <button type="submit" class="btn-submit">Submit Application</button>
      </form>
    </div>
  </div>
</body>
</html>
